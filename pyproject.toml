[project]
name = "astro-calc"
version = "1.0.0"
description = "Dịch vụ HTTP tính vị trí thiên thể, bọc Kerykeion nguyên bản. Engine báo cáo chiemtinh.vn gọi dịch vụ này."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
    "kerykeion==6.0.5",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
]

[project.optional-dependencies]
# Swiss Ephemeris (cần trình biên dịch C; dùng trong Docker Linux). Mặc định Kerykeion dùng libephemeris.
swiss = ["pyswisseph>=2.10.3.1"]

[project.scripts]
astro-calc = "astro_calc.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astro_calc"]
